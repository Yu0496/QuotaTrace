name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore UsageTray.sln

    - name: Build
      run: dotnet build UsageTray.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test UsageTray.sln --configuration Release --no-build --verbosity normal
